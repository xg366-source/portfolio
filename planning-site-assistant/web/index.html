<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>规划资料与场地分析助手</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body { margin:0; font-family: system-ui, sans-serif; display:flex; height:100vh; }
  #map { flex: 1.4; }
  #panel { flex: 1; display:flex; flex-direction:column; border-left:1px solid #ddd; }
  #panel header { padding:12px 16px; border-bottom:1px solid #eee; }
  #log { flex:1; overflow-y:auto; padding:16px; }
  .msg { margin-bottom:14px; line-height:1.55; }
  .cite { color:#555; font-size:12px; }
  .refused { background:#fff4e5; border:1px solid #f0c36d; border-radius:8px; padding:8px 10px; }
  #bar { display:flex; gap:8px; padding:12px; border-top:1px solid #eee; }
  #q { flex:1; padding:9px; font-size:15px; }
  select { margin-left:8px; }
</style>
</head>
<body>
<div id="map"></div>
<section id="panel">
  <header><strong>基地问答</strong>
    <label>图层<select id="layer">
      <option value="pct_hispanic">西裔占比</option>
      <option value="req_311_per_1000">311/千人</option>
      <option value="crime_per_1000">报案/千人</option>
      <option value="rest_pct_below_A">餐厅B级以下占比</option>
    </select></label>
  </header>
  <div id="log"></div>
  <div id="bar"><input id="q" placeholder="例如：311投诉最高的tract是哪个？"><button id="send">提问</button></div>
</section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([40.755, -73.885], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { attribution: '© OpenStreetMap' }).addTo(map);

const FILES = { pct_hispanic: 'acs_demographics_expanded.geojson',
  req_311_per_1000: '311_by_tract_2026ytd.geojson',
  crime_per_1000: 'crime_by_tract_2026ytd.geojson',
  rest_pct_below_A: 'food_safety_by_tract.geojson' };
let layerGroup;
async function draw(field) {
  const gj = await (await fetch('/data/gis/' + FILES[field])).json();
  const vals = gj.features.map(f => f.properties[field]).filter(v => v != null);
  const max = Math.max(...vals);
  if (layerGroup) layerGroup.remove();
  layerGroup = L.geoJSON(gj, { style: f => ({
      color: '#666', weight: .5,
      fillColor: '#e4572e', fillOpacity: .15 + .65 * (f.properties[field] || 0) / max }),
    onEachFeature: (f, l) => l.bindPopup(
      `GEOID ${f.properties.GEOID}<br>${field}: ${f.properties[field]}`) }).addTo(map);
}
document.getElementById('layer').onchange = e => draw(e.target.value);
draw('pct_hispanic');

const log = document.getElementById('log');
async function ask() {
  const input = document.getElementById('q');
  const q = input.value.trim(); if (!q) return; input.value = '';
  log.insertAdjacentHTML('beforeend', `<div class="msg"><b>问：</b>${q}</div>`);
  const res = await (await fetch('/ask', { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question: q }) })).json();
  const cites = res.citations.length
    ? `<div class="cite">来源：${res.citations.join('；')}</div>` : '';
  log.insertAdjacentHTML('beforeend',
    `<div class="msg ${res.refused ? 'refused' : ''}">${res.answer}${cites}</div>`);
  log.scrollTop = log.scrollHeight;
  const m = q.match(/\d{11}/);  // highlight a tract if the question names one
  if (m && layerGroup) layerGroup.eachLayer(l => {
    if (l.feature.properties.GEOID === m[0]) { l.openPopup(); map.fitBounds(l.getBounds()); } });
}
document.getElementById('send').onclick = ask;
document.getElementById('q').onkeydown = e => { if (e.key === 'Enter') ask(); };
</script>
</body>
</html>
